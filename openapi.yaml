openapi: 3.0.0
info:
  title: Clubs API
  description: |
    API for Hack Club clubs, built in Lua using Astra.

    When a lookup or update fails, every endpoint responds with a 5xx status and an `{"error": "..."}` body: 502 when Airtable fails or can't be reached, 500 for any other server error. A 200 response is always a real answer.
  version: 1.0.0
servers:
  - url: https://clubapi.hackclub.com
    description: Production server
components:
  securitySchemes:
    ApiKeyAuth:
      type: apiKey
      in: header
      name: Authorization
  schemas:
    PersonLeaderMatch:
      type: object
      properties:
        found:
          type: boolean
        club_name:
          type: string
          description: Present when found and the leader is linked to a club
        club_status:
          type: string
          description: Present when found and the leader is linked to a club
        role:
          type: string
          enum: [leader, co-leader]
          description: Present when found
    PersonMemberMatch:
      type: object
      properties:
        found:
          type: boolean
        club_name:
          type: string
          description: Present when found and the member is linked to a club
security:
  - {}
  - ApiKeyAuth: []

paths:
  ###################
  # DOCUMENTATION
  ###################
  /:
    get:
      summary: API Documentation
      description: Returns the API documentation page.
      security: []
      responses:
        '200':
          description: HTML documentation page

  ###################
  # CLUB MANAGEMENT
  ###################
  /clubs:
    get:
      summary: Get total number of clubs
      description: |
        Returns the number of clubs that aren't dormant, the same count as the Clubs platform's club directory.
        Refreshed from Airtable in the background about once a minute.
      security: []
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  totalClubs:
                    type: integer

  /clubs/map:
    get:
      summary: Get all clubs for map display
      description: |
        Returns the same pins as the Clubs platform's public map (clubs.hackclub.com/explore/map), with the same positions.
        A pin is never the club's real venue unless its leader chose that: by default it sits a random 0.5-3 km away.
        Dormant clubs, clubs a leader took off the map and clubs HQ has hidden are left out, as on the platform.
        The profile link and website only appear for clubs whose leader made the profile public.
        Fully public, no authentication supported or required. Refreshed about once a minute.
      security: []
      responses:
        '200':
          description: List of clubs
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: string
                      description: Airtable record ID of the club
                    fields:
                      type: object
                      properties:
                        club_name:
                          type: string
                        venue_lat_fuzz:
                          type: number
                          description: Latitude of the platform's map pin
                        venue_lng_fuzz:
                          type: number
                          description: Longitude of the platform's map pin
                        club_status:
                          type: string
                        place:
                          type: string
                          description: Where the club is, as the platform shows it (the country unless the club opted in to its town)
                        country:
                          type: string
                        ship_count:
                          type: integer
                          description: Approved ships made on the platform
                        profile_url:
                          type: string
                          description: Only for clubs with a public profile
                        club_website:
                          type: string
                          description: Only for clubs with a public profile
        '502':
          description: The Clubs platform's map couldn't be loaded

  /clubs/country:
    get:
      summary: Get amount of clubs in a country
      description: Returns the number of clubs that aren't dormant whose venue is in the country (case-insensitive, as spelled in the Clubs base, e.g. "United States").
      security: []
      parameters:
        - in: query
          name: country
          schema:
            type: string
          required: true
          description: The country to filter by (e.g. "United States", "India")
      responses:
        '200':
          description: Successful response
          content:
            application/json:
              schema:
                type: object
                properties:
                  clubs:
                    type: integer

  /clubs/level:
    get:
      summary: Retired - club levels
      description: Club levels were retired; the Clubs platform has no levels. Always responds 410.
      security: []
      responses:
        '410':
          description: Club levels were retired

  /club:
    get:
      summary: Get club info from name
      description: |
        Returns information about a club.
        Authentication is optional.
        - No key sent: what the Clubs platform shows signed-out. Clubs on its public map return their name, status, place, country and ship count; clubs with a public profile also return the profile link, website and member count (unless the club hides it). Anything else returns `{club_name: null}`.
        - Valid key sent: returns the full Airtable club record, with `member_count` counted the way the platform counts members (active members plus leaders).
        - Invalid key sent: 401.
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the club
      responses:
        '200':
          description: "Club information. Shape depends on whether a valid API key was sent (see description). `{club_name: null}` if no club matches."
          content:
            application/json:
              schema:
                type: object
                additionalProperties: true
                properties:
                  club_name:
                    type: string
                    nullable: true
        '400':
          description: Missing name parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing name parameter"
        '401':
          description: An API key was sent but it is invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /club/ambassador:
    get:
      summary: Get club ambassador
      description: Returns the email and Slack ID of the ambassador assigned to a club.
      security: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the club
      responses:
        '200':
          description: Ambassador information
          content:
            application/json:
              schema:
                type: object
                properties:
                  email:
                    type: string
                  slackId:
                    type: string
        '400':
          description: Missing parameter or no ambassador assigned
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing name parameter"
        '404':
          description: Club or ambassador not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Club not found"

  ###################
  # LEADER MANAGEMENT
  ###################
  /leader:
    get:
      summary: Get leader from email
      description: |
        Returns the club a person leads, looked up by email. Requires Read permissions.
        Leaders are counted the way the Clubs platform counts them: a Leaders record linked to a club, or an active member whose member type is co-leader. `role` says which.
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email of the leader
      responses:
        '200':
          description: Leader information
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    nullable: true
                  club_status:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum: [leader, co-leader]
                    description: Absent when the person doesn't lead a club
        '401':
          description: An API key was sent but it is invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
    post:
      summary: Change club leader's email
      description: Updates a leader's email address. Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Current email of the leader
        - in: query
          name: new_email
          schema:
            type: string
            format: email
          required: true
          description: New email for the leader
      responses:
        '200':
          description: Email updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_email:
                    type: string
        '400':
          description: Missing email parameter or leader not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /leader/slack:
    get:
      summary: Get leader from Slack ID
      description: |
        Returns the club a person leads, looked up by Slack ID. Requires Read permissions.
        Leaders are counted the way the Clubs platform counts them: a Leaders record linked to a club, or an active member whose member type is co-leader. `role` says which.
      parameters:
        - in: query
          name: slackid
          schema:
            type: string
          required: true
          description: Slack ID of the leader
      responses:
        '200':
          description: Leader information
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    nullable: true
                  club_status:
                    type: string
                    nullable: true
                  role:
                    type: string
                    enum: [leader, co-leader]
                    description: Absent when the person doesn't lead a club
        '400':
          description: Missing slackid parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing slackid parameter"
        '401':
          description: An API key was sent but it is invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /leader/name:
    get:
      summary: Get leader's name by email
      description: Returns the name of a leader or co-leader by email (leaders counted as in GET /leader). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email of the leader
      responses:
        '200':
          description: Leader name
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
        '400':
          description: Missing email parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing email parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Leader not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Leader not found"

  /leader/change:
    post:
      summary: Replace a club's leader
      description: |
        Creates a new leader record linked to the club and clears the old leader's
        club link (the old leader record itself is not deleted). Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: club
          schema:
            type: string
          required: true
          description: Name of the club
        - in: query
          name: new_email
          schema:
            type: string
            format: email
          required: true
          description: Email for the new leader
        - in: query
          name: old_email
          schema:
            type: string
            format: email
          required: true
          description: Email of the leader being replaced
      responses:
        '200':
          description: Leader replaced successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                    example: true
                  new_leader_id:
                    type: string
        '400':
          description: Missing parameters, club not found, or failed to create the new leader record
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing parameters (club, new_email, old_email)"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  ###################
  # SHIP MANAGEMENT
  ###################
  /ships:
    get:
      summary: Get club ships
      description: |
        Returns a club's ships the way the Clubs platform counts them. Each item has a `source`:
        - `platform`: approved ships made on the platform (Club Workshops base, Projects table, Status Approved or Submitted).
        - `external`: ships to other YSWS programs that the platform's external-ships job linked to this club (Club Stats base, Unified DB table).
        Authentication is optional.
        - No key sent: the ships the club's public profile on the platform shows (Title, Description, Playable URL, Workshop, Approved At), with no code links. Clubs without a public profile return an empty list.
        - Valid key sent: the full Airtable record of every platform and external ship.
        - Invalid key sent: 401.
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
      responses:
        '200':
          description: List of ships. Shape per item depends on whether a valid API key was sent (see description).
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Missing club_name parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: An API key was sent but it is invalid
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  ###################
  # MEMBER MANAGEMENT
  ###################
  /member/ships:
    get:
      summary: Get a member's ships
      description: Returns the list of ships (projects) associated with a member by email. Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email of the member
      responses:
        '200':
          description: List of ships
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  additionalProperties: true
        '400':
          description: Missing email parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing email parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /member:
    get:
      summary: Get member's club and email by name
      description: Returns the club and email associated with a member by name. Only active members count (pending join requests and removed members are not found, as on the Clubs platform). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the member
      responses:
        '200':
          description: Member information including club and email
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: Missing name parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing name parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Member not found"
    post:
      summary: Update member information
      description: Updates a member's name and/or email. Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Current name of the member to update
        - in: query
          name: new_name
          schema:
            type: string
          required: false
          description: New name for the member
        - in: query
          name: new_email
          schema:
            type: string
            format: email
          required: false
          description: New email for the member
      responses:
        '200':
          description: Member updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
                  email:
                    type: string
                    format: email
        '400':
          description: Missing name parameter, no updates provided, or member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
    delete:
      summary: Delete a member
      description: Deletes a member by name. Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Name of the member to delete
      responses:
        '200':
          description: Member deleted successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  deleted:
                    type: boolean
                    example: true
                  id:
                    type: string
        '400':
          description: Missing name parameter or failed to delete
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Member not found"

  /member/email:
    get:
      summary: Get member's club by email
      description: Returns the club name associated with a member by email. Only active members count (pending join requests and removed members are not found, as on the Clubs platform). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email of the member
      responses:
        '200':
          description: Club name associated with the member
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    nullable: true
        '400':
          description: Missing email parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing email parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Member not found"

  /member/name:
    get:
      summary: Get member's name by email
      description: Returns the name associated with a member by email. Only active members count (pending join requests and removed members are not found, as on the Clubs platform). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: true
          description: Email of the member
      responses:
        '200':
          description: Member name
          content:
            application/json:
              schema:
                type: object
                properties:
                  name:
                    type: string
        '400':
          description: Missing email parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing email parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Member not found"

  /member/slack:
    get:
      summary: Get member's club by Slack ID
      description: Returns the club name associated with a member by Slack ID. Only active members count (pending join requests and removed members are not found, as on the Clubs platform). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: slackid
          schema:
            type: string
          required: true
          description: Slack ID of the member
      responses:
        '200':
          description: Club name associated with the member
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    nullable: true
        '400':
          description: Missing slackid parameter
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing slackid parameter"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Member not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Member not found"

  /person:
    get:
      summary: Get person's clubs
      description: |
        Combines `/leader`, `/leader/slack`, `/member/email`, `/member/slack`, `/member/name` and `/club` into one request.
        Pass a Slack ID and/or one or more emails. Leader and member results are reported separately for each identifier so mismatches stay visible,
        and every matched club's full record is included under `clubs`, keyed by club name (same shape as `/club`).
        Matching ignores case. Requires Read permissions.
        Leaders and members are counted the way the Clubs platform counts them: a leader is a Leaders record linked to a club or an active co-leader member (`role` says which), and pending join requests and removed members are not members.
        Each club's `member_count` is active members plus leaders, as on the platform.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: slackid
          schema:
            type: string
          required: false
          description: Slack ID to look up
          example: "U01ABCDEFGH"
        - in: query
          name: emails
          schema:
            type: string
          required: false
          description: Comma-separated emails to look up (up to 20)
          example: "leader@example.com,leader.personal@example.com"
        - in: query
          name: email
          schema:
            type: string
            format: email
          required: false
          description: A single email to look up; combined with `emails` if both are given
      responses:
        '200':
          description: Matches for each identifier provided, the member's registered name, and the matched clubs' records.
          content:
            application/json:
              schema:
                type: object
                properties:
                  leader:
                    type: object
                    properties:
                      by_slack:
                        $ref: '#/components/schemas/PersonLeaderMatch'
                      by_email:
                        type: object
                        description: Keyed by email
                        additionalProperties:
                          $ref: '#/components/schemas/PersonLeaderMatch'
                  member:
                    type: object
                    properties:
                      by_slack:
                        $ref: '#/components/schemas/PersonMemberMatch'
                      by_email:
                        type: object
                        description: Keyed by email
                        additionalProperties:
                          $ref: '#/components/schemas/PersonMemberMatch'
                  member_name:
                    type: string
                    description: Name on the first member record matched by email, if any (same as `/member/name`)
                  clubs:
                    type: object
                    description: Full Airtable record for each matched club, keyed by club name (same shape as `/club`)
                    additionalProperties:
                      type: object
              example:
                leader:
                  by_slack: { found: true, club_name: "Example High School", club_status: "Active" }
                  by_email:
                    leader@example.com: { found: true, club_name: "Example High School", club_status: "Active" }
                member:
                  by_slack: { found: false }
                  by_email:
                    leader@example.com: { found: false }
                clubs:
                  Example High School: { id: "recXXXXXXXXXXXXXX", createdTime: "2025-09-01T12:00:00.000Z", fields: { club_name: "Example High School", status: "Active" } }
        '400':
          description: No identifiers provided, or more than 20 emails
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Provide a slackid, an email, or a comma-separated emails list"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '502':
          description: Airtable lookup failed
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Failed to look up this person in Airtable"

  /members:
    get:
      summary: Get club members
      description: Returns the names of the club's active members (pending join requests and removed members are left out, as on the Clubs platform). Requires Read permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
      responses:
        '200':
          description: Club members
          content:
            application/json:
              schema:
                type: object
                properties:
                  members:
                    type: array
                    items:
                      type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
        '404':
          description: Club not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Club not found"

  ###################
  # LEVEL/STATUS MANAGEMENT
  ###################
  /level:
    get:
      summary: Retired - club level
      description: Club levels were retired; the Clubs platform has no levels. Always responds 410.
      security: []
      responses:
        '410':
          description: Club levels were retired
    post:
      summary: Retired - change club level
      description: Club levels were retired; the Clubs platform has no levels. Responds 410 to a Write key, 401 otherwise.
      security:
        - ApiKeyAuth: []
      responses:
        '401':
          description: Unauthorized
        '410':
          description: Club levels were retired

  /status:
    get:
      summary: Get club status
      description: Returns the status of the specified club.
      security: []
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
      responses:
        '200':
          description: Club status
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
    post:
      summary: Change club status
      description: Updates the status of a club. Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
        - in: query
          name: status
          schema:
            type: string
          required: true
          description: New status for the club
      responses:
        '200':
          description: Status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  new_status:
                    type: string
        '400':
          description: Missing parameters or club not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /dormant:
    get:
      summary: Get club dormant status
      description: Returns whether the specified club's status is currently "Dormant".
      security: []
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
          example: "Example Club"
      responses:
        '200':
          description: Club dormant status
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    example: "Example Club"
                  dormant:
                    type: boolean
                    example: false
        '400':
          description: Missing club_name parameter or club not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing club_name parameter"
    post:
      summary: Update club dormant status
      description: Sets a club's status to "Dormant" (dormant=true) or "Active" (dormant=false). Requires Write permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: club_name
          schema:
            type: string
          required: true
          description: Name of the club
          example: "Example Club"
        - in: query
          name: dormant
          schema:
            type: string
            enum: ["true", "false"]
          required: true
          description: Dormant status (true or false)
          example: "true"
      responses:
        '200':
          description: Dormant status updated successfully
          content:
            application/json:
              schema:
                type: object
                properties:
                  club_name:
                    type: string
                    example: "Example Club"
                  dormant:
                    type: boolean
                    example: true
        '400':
          description: Missing parameters, invalid dormant value, or club not found
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Missing parameters (club_name, dormant)"
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  ###################
  # API KEY MANAGEMENT
  ###################
  /key/create:
    post:
      summary: Create a new API key
      description: Creates a new API key with the given name and permission level. Requires Admin permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: name
          schema:
            type: string
          required: true
          description: Label for the new key (e.g. the owner's name)
        - in: query
          name: perms
          schema:
            type: string
            enum: ["read", "write", "admin"]
          required: true
          description: Permission level for the new key
      responses:
        '200':
          description: Key created, or creation failed (see success field)
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  key:
                    type: string
                  name:
                    type: string
                  perms:
                    type: string
                  error:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"

  /key/revoke:
    post:
      summary: Revoke an API key
      description: Deletes an API key. Requires Admin permissions.
      security:
        - ApiKeyAuth: []
      parameters:
        - in: query
          name: key
          schema:
            type: string
          required: true
          description: The API key value to revoke
      responses:
        '200':
          description: Revocation result
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  owner_email:
                    type: string
        '401':
          description: Unauthorized
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    example: "Unauthorized"
