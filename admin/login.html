<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Clubs API Admin</title>
    <style>
      :root {
        --red: #ec3750;
        --bg: #f9fafc;
        --card: #ffffff;
        --text: #1f2d3d;
        --muted: #8492a6;
        --border: #e0e6ed;
        --error-bg: #fde8eb;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #17171d;
          --card: #252429;
          --text: #f9fafc;
          --muted: #8492a6;
          --border: #3c4858;
          --error-bg: #3b1d23;
        }
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: grid;
        place-items: center;
        padding: 16px;
        background: var(--bg);
        color: var(--text);
        font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      }
      .card {
        width: 100%;
        max-width: 380px;
        background: var(--card);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 32px 28px;
      }
      h1 { margin: 0 0 4px; font-size: 22px; }
      p { margin: 0 0 24px; color: var(--muted); font-size: 14px; line-height: 1.5; }
      a.button {
        display: block;
        text-align: center;
        background: var(--red);
        color: #fff;
        text-decoration: none;
        font-weight: 600;
        padding: 12px 16px;
        border-radius: 8px;
      }
      a.button:hover { filter: brightness(0.95); }
      .error {
        display: none;
        background: var(--error-bg);
        color: var(--red);
        border-radius: 8px;
        padding: 10px 12px;
        font-size: 14px;
        margin-bottom: 16px;
      }
    </style>
  </head>
  <body>
    <main class="card">
      <h1>Clubs API Admin</h1>
      <p>Manage API keys and review requests. Access is limited to approved Hack Club accounts.</p>
      <div class="error" id="error"></div>
      <a class="button" href="/admin/login">Sign in with Hack Club</a>
    </main>
    <script>
      const messages = {
        not_allowed: "That account isn't on the admin list.",
        unverified: "Your Hack Club email isn't verified yet.",
        state_mismatch: "Your sign-in expired. Please try again.",
        not_configured: "The admin panel hasn't been configured on this server yet.",
        auth_failed: "Hack Club Auth sign-in failed. Please try again.",
        signed_out: "You've been signed out.",
      };
      const code = new URLSearchParams(location.search).get("error");
      if (code) {
        const box = document.getElementById("error");
        box.textContent = messages[code] || "Sign-in failed. Please try again.";
        box.style.display = "block";
      }
    </script>
  </body>
</html>
